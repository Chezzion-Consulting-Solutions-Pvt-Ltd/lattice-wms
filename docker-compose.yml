services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-admin-password}
      POSTGRES_DB: ${POSTGRES_DB:-lattice_control}
      POSTGRES_APP_USER: ${POSTGRES_USER:-lattice_control_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:-local-control-password}
      TENANT_ALPHA_DB_PASSWORD: ${TENANT_ALPHA_DB_PASSWORD:-local-alpha-password}
      TENANT_BETA_DB_PASSWORD: ${TENANT_BETA_DB_PASSWORD:-local-beta-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-lattice_control}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env.example
      - path: .env
        required: false
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    build:
      context: ./backend
    env_file:
      - .env.example
      - path: .env
        required: false
    command: ["celery", "-A", "lattice", "worker", "--loglevel=INFO"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A lattice inspect ping --timeout=5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 6

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
