name: Lattice CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lattice_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Django checks
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "true"
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lattice_control
          TENANT_ALPHA_DB_PASSWORD: alpha
          TENANT_BETA_DB_PASSWORD: beta
        run: python manage.py check
      - name: Backend tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "true"
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lattice_control
          TENANT_ALPHA_DB_PASSWORD: alpha
          TENANT_BETA_DB_PASSWORD: beta
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
